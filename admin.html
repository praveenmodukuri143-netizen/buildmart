<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuildMart Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f9;
      color: #172b4d;
    }

    header {
      background: #0b2342;
      color: white;
      padding: 24px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 28px;
    }

    header button {
      background: #ff8a00;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 35px auto;
    }

    .login-box {
      max-width: 420px;
      margin: 80px auto;
      background: white;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .login-box h2 {
      margin-bottom: 25px;
      text-align: center;
    }

    input, select {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #ff8a00;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .error {
      color: #d93025;
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
    }

    #dashboard {
      display: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .stat-card h3 {
      color: #666;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .stat-card p {
      font-size: 28px;
      font-weight: bold;
    }

    .search {
      margin-bottom: 25px;
    }

    .orders-title {
      margin-bottom: 20px;
    }

    .order-card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 15px;
    }

    .order-id {
      font-weight: bold;
      font-size: 17px;
    }

    .customer-info {
      line-height: 1.8;
      color: #555;
      margin-bottom: 15px;
    }

    .items {
      background: #f7f8fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
    }

    .order-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
    }

    .delete-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 7px;
      cursor: pointer;
    }

    .logout-btn {
      background: #dc3545 !important;
    }

    .empty {
      background: white;
      padding: 40px;
      text-align: center;
      border-radius: 14px;
      color: #777;
    }

    @media (max-width: 768px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .order-top,
      .order-bottom {
        flex-direction: column;
        align-items: flex-start;
      }

      header {
        padding: 20px;
      }

      header h1 {
        font-size: 22px;
      }

      .container {
        width: 94%;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginSection">

    <div class="login-box">
      <h2>🔐 BuildMart Admin Login</h2>

      <input
        type="email"
        id="email"
        placeholder="Admin Email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button class="login-btn" onclick="adminLogin()">
        Login
      </button>

      <div id="loginError" class="error"></div>
    </div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard">

    <header>
      <h1>BuildMart Admin</h1>

      <button class="logout-btn" onclick="logout()">
        Logout
      </button>
    </header>

    <div class="container">

      <!-- STATS -->
      <div class="stats">

        <div class="stat-card">
          <h3>Total Orders</h3>
          <p id="totalOrders">0</p>
        </div>

        <div class="stat-card">
          <h3>Total Sales</h3>
          <p id="totalSales">₹0</p>
        </div>

        <div class="stat-card">
          <h3>Pending Orders</h3>
          <p id="pendingOrders">0</p>
        </div>

      </div>


      <!-- SEARCH -->
      <div class="search">
        <input
          type="text"
          id="searchInput"
          placeholder="Search by Order ID, Customer Name or Phone..."
          oninput="filterOrders()"
        >
      </div>


      <h2 class="orders-title">Customer Orders</h2>

      <div id="ordersContainer">
        <div class="empty">
          Loading orders...
        </div>
      </div>

    </div>

  </div>


  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>


  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyDErFysC_Z7dP96Gn29cblxcgsmzIneobA",
      authDomain: "buildmart-f394b.firebaseapp.com",
      projectId: "buildmart-f394b",
      storageBucket: "buildmart-f394b.firebasestorage.app",
      messagingSenderId: "255269056106",
      appId: "1:255269056106:web:60ba9cf4696ea2717ce413",
      measurementId: "G-JVRDZ49BC0"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();
    const auth = firebase.auth();

    let allOrders = [];


    // LOGIN
    async function adminLogin() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const errorBox =
        document.getElementById("loginError");

      errorBox.textContent = "";

      if (!email || !password) {
        errorBox.textContent =
          "Please enter email and password.";
        return;
      }

      try {

        await auth.signInWithEmailAndPassword(
          email,
          password
        );

      } catch (error) {

        console.error(error);

        errorBox.textContent =
          error.message;

      }

    }


    // AUTH STATE
    auth.onAuthStateChanged(async (user) => {

      if (user) {

        if (
          user.email !==
          "praveenmodukuri143@gmail.com"
        ) {

          alert("Access denied.");

          await auth.signOut();

          return;
        }

        document.getElementById(
          "loginSection"
        ).style.display = "none";

        document.getElementById(
          "dashboard"
        ).style.display = "block";

        loadOrders();

      } else {

        document.getElementById(
          "loginSection"
        ).style.display = "block";

        document.getElementById(
          "dashboard"
        ).style.display = "none";

      }

    });


    // LOGOUT
    async function logout() {

      await auth.signOut();

    }


    // LOAD ORDERS
    async function loadOrders() {

      const container =
        document.getElementById(
          "ordersContainer"
        );

      container.innerHTML =
        '<div class="empty">Loading orders...</div>';

      try {

        const snapshot =
          await db
            .collection("orders")
            .get();

        allOrders = [];

        snapshot.forEach(doc => {

          allOrders.push({
            id: doc.id,
            ...doc.data()
          });

        });

        allOrders.sort((a, b) => {

          const dateA =
            a.createdAt?.toMillis?.() || 0;

          const dateB =
            b.createdAt?.toMillis?.() || 0;

          return dateB - dateA;

        });

        updateStats();
        renderOrders(allOrders);

      } catch (error) {

        console.error(
          "Firestore Error:",
          error
        );

        container.innerHTML = `
          <div class="empty">
            <h3>Unable to Load Orders</h3>
            <p>Check Firebase connection or admin permissions.</p>
          </div>
        `;

      }

    }


    // STATS
    function updateStats() {

      const total =
        allOrders.length;

      let sales = 0;
      let pending = 0;

      allOrders.forEach(order => {

        sales +=
          Number(order.total || 0);

        const status =
          order.status || "Order Received";

        if (
          status === "Order Received" ||
          status === "Payment Pending" ||
          status === "Processing"
        ) {
          pending++;
        }

      });

      document.getElementById(
        "totalOrders"
      ).textContent = total;

      document.getElementById(
        "totalSales"
      ).textContent =
        "₹" + sales.toLocaleString("en-IN");

      document.getElementById(
        "pendingOrders"
      ).textContent = pending;

    }


    // RENDER ORDERS
    function renderOrders(orders) {

      const container =
        document.getElementById(
          "ordersContainer"
        );

      if (!orders.length) {

        container.innerHTML = `
          <div class="empty">
            No orders found.
          </div>
        `;

        return;

      }

      container.innerHTML = "";

      orders.forEach(order => {

        const items =
          Array.isArray(order.items)
            ? order.items
            : [];

        const itemHTML =
          items.map(item => `
            <div class="item-row">
              <span>
                ${item.name || "Product"}
                × ${item.quantity || 1}
              </span>

              <span>
                ₹${(
                  Number(item.price || 0) *
                  Number(item.quantity || 1)
                ).toLocaleString("en-IN")}
              </span>
            </div>
          `).join("");


        const card =
          document.createElement("div");

        card.className = "order-card";

        card.innerHTML = `

          <div class="order-top">

            <div class="order-id">
              Order ID: ${order.id}
            </div>

            <select
              onchange="changeStatus('${order.id}', this.value)"
            >

              <option value="Order Received"
                ${order.status === "Order Received" ? "selected" : ""}>
                Order Received
              </option>

              <option value="Payment Pending"
                ${order.status === "Payment Pending" ? "selected" : ""}>
                Payment Pending
              </option>

              <option value="Processing"
                ${order.status === "Processing" ? "selected" : ""}>
                Processing
              </option>

              <option value="Shipped"
                ${order.status === "Shipped" ? "selected" : ""}>
                Shipped
              </option>

              <option value="Delivered"
                ${order.status === "Delivered" ? "selected" : ""}>
                Delivered
              </option>

              <option value="Cancelled"
                ${order.status === "Cancelled" ? "selected" : ""}>
                Cancelled
              </option>

            </select>

          </div>


          <div class="customer-info">

            <strong>Customer:</strong>
            ${order.customerName || "-"}
            <br>

            <strong>Phone:</strong>
            ${order.customerPhone || "-"}
            <br>

            <strong>Address:</strong>
            ${order.customerAddress || "-"}
            <br>

            <strong>Location:</strong>
            ${order.customerLocation || "-"}

          </div>


          <div class="items">

            <strong>Items</strong>

            ${itemHTML}

          </div>


          <div class="order-bottom">

            <div>
              <div class="total">
                ₹${Number(order.total || 0).toLocaleString("en-IN")}
              </div>

              <div>
                Payment:
                ${order.paymentMethod || "-"}
              </div>
            </div>

            <button
              class="delete-btn"
              onclick="deleteOrder('${order.id}')"
            >
              Delete
            </button>

          </div>

        `;

        container.appendChild(card);

      });

    }


    // CHANGE STATUS
    async function changeStatus(
      orderId,
      newStatus
    ) {

      try {

        await db
          .collection("orders")
          .doc(orderId)
          .update({
            status: newStatus
          });


        await db
          .collection("publicOrders")
          .doc(orderId)
          .update({
            status: newStatus
          });


        alert(
          "Order status updated successfully."
        );

        loadOrders();

      } catch (error) {

        console.error(error);

        alert(
          "Failed to update order status: " +
          error.message
        );

      }

    }


    // DELETE ORDER
    async function deleteOrder(orderId) {

      const confirmDelete =
        confirm(
          "Are you sure you want to delete this order?"
        );

      if (!confirmDelete) return;

      try {

        await db
          .collection("orders")
          .doc(orderId)
          .delete();


        await db
          .collection("publicOrders")
          .doc(orderId)
          .delete();


        alert("Order deleted.");

        loadOrders();

      } catch (error) {

        console.error(error);

        alert(
          "Failed to delete order: " +
          error.message
        );

      }

    }


    // SEARCH
    function filterOrders() {

      const search =
        document
          .getElementById("searchInput")
          .value
          .toLowerCase()
          .trim();

      const filtered =
        allOrders.filter(order => {

          return (
            String(order.id || "")
              .toLowerCase()
              .includes(search)

            ||

            String(order.customerName || "")
              .toLowerCase()
              .includes(search)

            ||

            String(order.customerPhone || "")
              .toLowerCase()
              .includes(search)
          );

        });

      renderOrders(filtered);

    }

  </script>

</body>
</html>
