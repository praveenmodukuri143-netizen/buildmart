<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order - BuildMart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: 60px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #f59e0b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #d97706;
    }

    #result {
      margin-top: 25px;
    }

    .order-box {
      background: #f8fafc;
      padding: 20px;
      border-radius: 10px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      font-weight: bold;
    }

    .status {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      background: #fef3c7;
      color: #92400e;
      font-weight: bold;
    }

    .error {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      background: #fee2e2;
      color: #991b1b;
    }

    .item {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .item:last-child {
      border-bottom: none;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>📦 Track Your Order</h1>
      <p class="subtitle">
        Enter your BuildMart Order ID
      </p>

      <input
        type="text"
        id="orderIdInput"
        placeholder="Example: BM123456"
      >

      <button onclick="trackOrder()">
        Track Order
      </button>

      <div id="result"></div>

    </div>
  </div>


  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyDErFysC_Z7dP96Gn29cblxcgsmzIneobA",
      authDomain: "buildmart-f394b.firebaseapp.com",
      projectId: "buildmart-f394b",
      storageBucket: "buildmart-f394b.firebasestorage.app",
      messagingSenderId: "255269056106",
      appId: "1:255269056106:web:60ba9cf4696ea2717ce413",
      measurementId: "G-JVRDZ49BC0"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();


    async function trackOrder() {

      const orderId =
        document
          .getElementById("orderIdInput")
          .value
          .trim();

      const result =
        document.getElementById("result");

      if (!orderId) {
        result.innerHTML =
          `<div class="error">
            Please enter your Order ID.
          </div>`;
        return;
      }

      result.innerHTML = "🔎 Checking order...";

      try {

        // IMPORTANT:
        // Public tracking data is stored in publicOrders
        const doc =
          await db
            .collection("publicOrders")
            .doc(orderId)
            .get();

        if (!doc.exists) {

          result.innerHTML =
            `<div class="error">
              ❌ Order not found.<br><br>
              Please check your Order ID.
            </div>`;

          return;
        }

        const order = doc.data();

        let itemsHTML = "";

        if (Array.isArray(order.items)) {

          order.items.forEach(item => {

            itemsHTML += `
              <div class="item">
                <strong>${item.name || "Product"}</strong>
                × ${item.quantity || 1}
              </div>
            `;

          });

        }

        const orderDate = order.createdAt
          ? (
              order.createdAt.toDate
                ? order.createdAt.toDate().toLocaleString()
                : order.createdAt
            )
          : "Not available";


        result.innerHTML = `

          <div class="order-box">

            <div class="row">
              <span class="label">Order ID</span>
              <span>${order.orderId || orderId}</span>
            </div>

            <div class="row">
              <span class="label">Status</span>
              <span class="status">
                ${order.status || "Order Received"}
              </span>
            </div>

            <div class="row">
              <span class="label">Order Date</span>
              <span>${orderDate}</span>
            </div>

            <div style="margin-top:20px;">
              <div class="label" style="margin-bottom:10px;">
                Items
              </div>

              ${itemsHTML || "No item information available."}
            </div>

            <div class="row" style="margin-top:15px;">
              <span class="label">Total</span>
              <strong>
                ₹${Number(order.total || 0).toLocaleString("en-IN")}
              </strong>
            </div>

          </div>
        `;

      } catch (error) {

        console.error("Track Order Error:", error);

        result.innerHTML =
          `<div class="error">
            ❌ Something went wrong.<br><br>
            Please try again.
          </div>`;
      }

    }

  </script>

</body>
</html>
